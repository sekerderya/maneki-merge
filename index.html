<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>Maneki Merge</title>
    <meta
      name="description"
      content="Lucky-cat merge game with a growing jar. Offline PWA for iOS and Android."
    />
    <meta name="theme-color" content="#fcefdf" />
    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Home-screen app (iOS ignores the manifest's display mode and orientation). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Maneki" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/pwa-192x192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!-- vite-plugin-pwa injects the manifest link. -->

    <!-- Paint the theme color before the CSS bundle loads (no white flash on launch). -->
    <style>
      html {
        background: #fcefdf;
      }
      /*
       * The loading screen (GAME_DESIGN §2.0, ui/loadingScreen.ts), styled here so it shows before
       * the scripts arrive: the menu's garden, logo and golden cat, and the owner's bar (the long
       * score card), whose gold grows from the paw as the game loads. The script sets the bar's
       * art and slices (in source pixels, scaled by --s) and --progress.
       */
      .loading {
        position: fixed;
        inset: 0;
        z-index: 1100;
        overflow: hidden;
        background: #f7f0d4;
        transition: opacity ease-out;
      }
      .loading.is-done {
        opacity: 0;
        pointer-events: none;
      }
      .loading img {
        position: absolute;
        user-select: none;
        -webkit-user-select: none;
        -webkit-user-drag: none;
      }
      .loading-bg {
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 100%;
      }
      .loading-logo {
        top: calc(env(safe-area-inset-top, 0px) + 6vh);
        left: 50%;
        width: min(82vw, 44vh);
        translate: -50% 0;
      }
      .loading-hero {
        top: 36vh;
        left: 50%;
        width: min(66vw, 36vh);
        translate: -50% 0;
        animation: loading-bob 1.6s ease-in-out infinite alternate;
      }
      @keyframes loading-bob {
        to {
          translate: -50% -2.5vh;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .loading-hero {
          animation: none;
        }
      }
      .loading-bar {
        --s: calc(54px / var(--bar-h, 1));
        position: absolute;
        left: 50%;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 15vh);
        width: min(80vw, 340px);
        height: 54px;
        translate: -50% 0;
        box-sizing: border-box;
        border: 0 solid transparent;
        border-image: var(--bar-art) 0 var(--bar-right) 0 var(--bar-left) fill / 0
          calc(var(--bar-right) * var(--s)) 0 calc(var(--bar-left) * var(--s)) stretch;
        visibility: hidden;
      }
      .loading-bar.is-art {
        visibility: visible;
      }
      .loading-fill {
        position: absolute;
        left: calc(var(--fill-x) * var(--s));
        top: calc(var(--fill-y) * var(--s));
        width: calc(
          (var(--fill-left) + var(--fill-right)) * var(--s) + var(--progress, 0) *
            (100% - (var(--bar-left) + var(--bar-right)) * var(--s))
        );
        height: calc(var(--fill-h) * var(--s));
        box-sizing: border-box;
        border: 0 solid transparent;
        border-image: var(--fill-art) 0 var(--fill-right) 0 var(--fill-left) fill / 0
          calc(var(--fill-right) * var(--s)) 0 calc(var(--fill-left) * var(--s)) stretch;
        opacity: calc(var(--progress, 0) * 40);
        transition: width 200ms ease-out;
      }
      .loading-label {
        position: absolute;
        left: 0;
        right: 0;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 15vh - 40px);
        margin: 0;
        text-align: center;
        font:
          700 18px 'Fredoka',
          system-ui,
          sans-serif;
        color: #4a2e25;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <section id="menu-screen" class="screen" aria-label="Main menu"></section>
      <section id="game-screen" class="screen" aria-label="Game" hidden></section>
      <div id="overlays"></div>
    </main>
    <div
      id="loading"
      class="loading"
      role="progressbar"
      aria-label="Loading"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="0"
    >
      <img class="loading-bg" src="/assets/scene/background.webp" alt="" />
      <img class="loading-logo" src="/assets/menu/logo.webp" alt="" />
      <img class="loading-hero" src="/assets/menu/hero.webp" alt="" />
      <div class="loading-bar"><div class="loading-fill"></div></div>
      <p class="loading-label"></p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
