apply plugin: 'com.android.application'

// Maneki Merge (docs/TECH_SPEC.md §16): the app's version is the game's. versionName is
// package.json's version and versionCode major × 1 000 000 + minor × 1 000 + patch, so every
// release counts up (0.53.0 → 53000, above the old TWA's 1).
def gameVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version
def (versionMajor, versionMinor, versionPatch) = gameVersion.tokenize('.-').take(3).collect { it as int }

android {
    namespace = "io.github.sekerderya.manekimerge"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.sekerderya.manekimerge"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode versionMajor * 1000000 + versionMinor * 1000 + versionPatch
        versionName gameVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        // The dev app: installs beside the Play app with its own save, starts with the debug
        // panel and fake ads, and only ever shows test ads (the name in src/debug/res).
        debug {
            applicationIdSuffix '.dev'
            versionNameSuffix '-dev'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Firebase (docs/TECH_SPEC.md §17): Analytics and Crashlytics need google-services.json, which the
// Android workflow writes from the GOOGLE_SERVICES_JSON secret (never committed). It must know both
// apps, the Play app and the dev app, or the dev build couldn't find its own; without it (or with
// one app missing) the app is built without Firebase, and vite.config.ts tells the page the same.
def servicesJSON = file('google-services.json')
def firebaseApps = ['io.github.sekerderya.manekimerge', 'io.github.sekerderya.manekimerge.dev']
if (servicesJSON.exists() && firebaseApps.every { servicesJSON.text.contains("\"${it}\"") }) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
} else if (servicesJSON.exists()) {
    logger.warn("google-services.json lacks one of ${firebaseApps}: built without Firebase.")
} else {
    logger.info("No google-services.json: built without Firebase.")
}
