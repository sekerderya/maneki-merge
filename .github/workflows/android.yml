name: Android

# Builds the Google Play app (TECH_SPEC §16, docs/PLAY_STORE.md): Capacitor's Android project with
# the game's `android` build inside it and AdMob beside it. It runs on every release tag (path
# filters don't apply to tags), when the Android project or its config changes, and by hand. A push
# to main only updates the web app: the Android app gets the game with the next bundle uploaded to
# Play.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Set by `npm run android:key`. Without it the outputs are unsigned (they still show the
      # project builds) and can't be uploaded to Play.
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build the game into the app (vite --mode android, cap sync)
        run: npm run build:android
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Capacitor 8 compiles for Java 21.
          java-version: 21
          cache: gradle
      - name: Build the bundle (Play), the APK (direct install) and the dev APK
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease assembleRelease assembleDebug
      - name: Show the apps' identity
        working-directory: android
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"
          for APK in app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/debug/app-debug.apk; do
            "$BUILD_TOOLS/aapt2" dump badging "$APK" \
              | grep -E "^(package|sdkVersion|targetSdkVersion|application-label|launchable-activity)"
          done
      - name: Sign with the upload key
        if: env.HAS_UPLOAD_KEY == 'true'
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p out
          KEYSTORE="$RUNNER_TEMP/upload-key.p12"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          jarsigner -keystore "$KEYSTORE" -storetype PKCS12 -storepass:env KEYSTORE_PASSWORD \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            -signedjar out/maneki-merge.aab app/build/outputs/bundle/release/app-release.aab upload
          sign_apk() {
            "$BUILD_TOOLS/zipalign" -p -f 4 "$1" "$RUNNER_TEMP/aligned.apk"
            # No v4 signature: its .idsig file is only for adb's incremental installs.
            "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias upload --v4-signing-enabled false --out "$2" "$RUNNER_TEMP/aligned.apk"
            "$BUILD_TOOLS/apksigner" verify "$2"
          }
          sign_apk app/build/outputs/apk/release/app-release-unsigned.apk out/maneki-merge.apk
          # The dev app too, so a newer one installs over the last (a runner's own debug key
          # changes every run).
          sign_apk app/build/outputs/apk/debug/app-debug.apk out/maneki-merge-dev.apk
          FINGERPRINT=$(keytool -list -v -keystore "$KEYSTORE" -storetype PKCS12 \
            -storepass:env KEYSTORE_PASSWORD -alias upload | grep -m1 'SHA256:' | sed 's/.*SHA256: *//')
          rm "$KEYSTORE"
          VERSION=$("$BUILD_TOOLS/aapt2" dump badging out/maneki-merge.apk | grep -m1 '^package' \
            | sed -E "s/.*versionCode='([0-9]+)'.*versionName='([^']+)'.*/\2 (versionCode \1)/")
          {
            echo "### Maneki Merge $VERSION, signed with the upload key"
            echo
            echo "Upload key SHA-256: \`$FINGERPRINT\`"
            echo
            echo "- \`maneki-merge.aab\` goes to Play."
            echo "- \`maneki-merge.apk\` installs the release app directly on a phone."
            echo "- \`maneki-merge-dev.apk\` installs the dev app (Maneki Dev) beside it: debug panel, test ads."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the unsigned outputs
        if: env.HAS_UPLOAD_KEY != 'true'
        working-directory: android
        run: |
          mkdir -p out
          cp app/build/outputs/bundle/release/app-release.aab out/maneki-merge-unsigned.aab
          cp app/build/outputs/apk/release/app-release-unsigned.apk out/maneki-merge-unsigned.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/maneki-merge-dev.apk
          echo "::warning::No upload key in the repository secrets (run npm run android:key): the outputs are unsigned and can't go to Play."
      - uses: actions/upload-artifact@v7
        with:
          name: maneki-merge-android
          path: android/out/
          retention-days: 30
