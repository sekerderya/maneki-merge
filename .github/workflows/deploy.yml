name: Deploy

on:
  push:
    branches: [main]
    # Pushes that only touch files outside the app (docs, notes, art sources) don't rebuild the site.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'art-source/**'
      - '.claude/**'
      - 'android/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # The play statistics (TECH_SPEC §17). Without them the web app never asks and sends nothing.
          GAMEANALYTICS_GAME_KEY: ${{ secrets.GAMEANALYTICS_GAME_KEY }}
          GAMEANALYTICS_SECRET_KEY: ${{ secrets.GAMEANALYTICS_SECRET_KEY }}
          GAMEANALYTICS_TEST_GAME_KEY: ${{ secrets.GAMEANALYTICS_TEST_GAME_KEY }}
          GAMEANALYTICS_TEST_SECRET_KEY: ${{ secrets.GAMEANALYTICS_TEST_SECRET_KEY }}
          FIREBASE_WEB_CONFIG: ${{ secrets.FIREBASE_WEB_CONFIG }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
