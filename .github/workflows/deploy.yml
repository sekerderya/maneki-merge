name: Deploy

on:
  push:
    branches: [main]
    # Pushes that only touch files outside the app (docs, notes, art sources) don't rebuild the site.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'art-source/**'
      - '.claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # The E2E suite runs beside the build, split by device profile and shard, so it costs about a
  # quarter of its serial time. The deploy still waits for every part.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - { project: iphone-webkit, browser: webkit, shard: 1/2 }
          - { project: iphone-webkit, browser: webkit, shard: 2/2 }
          - { project: pixel-chromium, browser: chromium, shard: 1/2 }
          - { project: pixel-chromium, browser: chromium, shard: 2/2 }
    name: e2e (${{ matrix.project }} ${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}-${{ strategy.job-index }}
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
